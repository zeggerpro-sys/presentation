<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MilkHunter Pro</title>
<style>
  :root {
    --green: #15803D; --green-dark: #0F5C2C; --green-light: #E8F5E9;
    --amber: #A16207; --amber-light: #FEF3C7;
    --ink: #14181580; --ink-solid: #12160f; --ink-soft: #1D231E;
    --paper: #F7F8FA; --grey: #4B5563; --grey-light: #D1D5DB;
    --white: #FFFFFF;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: 'Georgia', 'Cambria', serif;
    background: var(--ink-solid); color: var(--white);
  }
  .body-font { font-family: 'Helvetica Neue', Arial, sans-serif; }

  #deck { position: relative; width: 100%; height: 100vh; }
  .section {
    position: absolute; inset: 0; width: 100%; height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 5vh 8vw; opacity: 0; pointer-events: none;
    transform: translateY(40px);
    transition: opacity 700ms cubic-bezier(0.16,1,0.3,1), transform 700ms cubic-bezier(0.16,1,0.3,1);
  }
  .section.active { opacity: 1; pointer-events: auto; transform: translateY(0); }
  .section.leaving-up { transform: translateY(-40px); }

  .section-light { background: var(--paper); color: var(--ink-solid); }
  .section-dark { background: linear-gradient(160deg, #12160f 0%, #182018 60%, #0F1710 100%); color: var(--white); }

  .glow { position: absolute; border-radius: 50%; filter: blur(2px); pointer-events: none; z-index: 0; }
  .content-wrap { position: relative; z-index: 1; width: 100%; max-width: 1180px; display: flex; flex-direction: column; align-items: center; }

  .kicker {
    font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 13px; font-weight: 700;
    letter-spacing: 3px; text-transform: uppercase; color: var(--amber); margin-bottom: 14px;
    opacity: 0; transform: translateY(14px); transition: all 600ms ease 100ms;
  }
  .section.active .kicker { opacity: 1; transform: translateY(0); }

  h1.title {
    font-size: clamp(28px, 4vw, 52px); font-weight: 700; text-align: center; line-height: 1.15;
    margin-bottom: 20px; max-width: 900px;
    opacity: 0; transform: translateY(20px); transition: all 700ms ease 180ms;
  }
  .section.active h1.title { opacity: 1; transform: translateY(0); }

  p.lede {
    font-family: 'Helvetica Neue', Arial, sans-serif; font-size: clamp(14px, 1.3vw, 17px);
    text-align: center; max-width: 640px; line-height: 1.55; color: inherit; opacity: 0.85;
    margin-bottom: 8px;
    opacity: 0; transform: translateY(20px); transition: all 700ms ease 300ms;
  }
  .section.active p.lede { opacity: 0.85; transform: translateY(0); }

  .stagger { opacity: 0; transform: translateY(24px); transition: all 600ms cubic-bezier(0.16,1,0.3,1); }
  .section.active .stagger { opacity: 1; transform: translateY(0); }

  /* Навигация справа: точки */
  #navdots {
    position: fixed; right: 26px; top: 50%; transform: translateY(-50%);
    display: flex; flex-direction: column; gap: 14px; z-index: 50;
  }
  .navdot {
    width: 9px; height: 9px; border-radius: 50%; background: rgba(255,255,255,0.28);
    cursor: pointer; transition: all 250ms ease; border: none; padding: 0;
  }
  .navdot:hover { background: rgba(255,255,255,0.55); }
  .navdot.active { background: var(--amber); width: 11px; height: 11px; box-shadow: 0 0 0 3px rgba(161,98,7,0.25); }

  /* Стрелки вверх/вниз */
  .navarrow {
    position: fixed; left: 50%; transform: translateX(-50%); z-index: 50;
    width: 42px; height: 42px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,0.3);
    background: rgba(255,255,255,0.06); backdrop-filter: blur(6px); cursor: pointer;
    display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,0.85);
    transition: all 200ms ease; font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 18px;
  }
  .navarrow:hover { background: rgba(255,255,255,0.15); transform: translateX(-50%) scale(1.08); }
  .navarrow.down { bottom: 22px; }
  .navarrow.up { top: 22px; }
  .section-light ~ #navarrow-adapt { color: #000; }

  .progress-bar { position: fixed; top: 0; left: 0; height: 3px; background: var(--amber); z-index: 60; transition: width 500ms ease; }

  /* Кнопки/бейджи */
  .badge {
    display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 20px;
    font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 12.5px; font-weight: 600;
  }

  /* Карточки */
  .card {
    border-radius: 14px; padding: 22px; transition: transform 250ms ease, box-shadow 250ms ease;
  }
  .card:hover { transform: translateY(-4px); }

  ::-webkit-scrollbar { display: none; }

  @keyframes floaty { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-8px); } }
  @keyframes pulse-ring { 0% { box-shadow: 0 0 0 0 rgba(21,128,61,0.5); } 100% { box-shadow: 0 0 0 14px rgba(21,128,61,0); } }
  @keyframes growBar { from { transform: scaleY(0); } to { transform: scaleY(1); } }
  @keyframes countUp { from { opacity: 0; } to { opacity: 1; } }
  @keyframes spin-slow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes drift { 0%,100% { transform: translate(0,0); } 50% { transform: translate(15px,-10px); } }

  .logo-float { animation: floaty 4s ease-in-out infinite; }
  .drift1 { animation: drift 9s ease-in-out infinite; }
  .drift2 { animation: drift 12s ease-in-out infinite reverse; }
</style>
</head>
<body>

<div class="progress-bar" id="progressBar" style="width:0%"></div>
<div id="navdots"></div>
<button class="navarrow up" id="btnUp" aria-label="Вверх">↑</button>
<button class="navarrow down" id="btnDown" aria-label="Вниз">↓</button>

<div id="deck"></div>

<script>
// ═══════════════════════════════════════════════════════════════
// MilkHunter Pro — интерактивная визитка. Контент секций + навигация.
// ═══════════════════════════════════════════════════════════════

const GREEN = "#15803D", GREEN_DARK = "#0F5C2C", GREEN_LIGHT = "#E8F5E9";
const AMBER = "#A16207", AMBER_LIGHT = "#FEF3C7";

function glow(x, y, w, h, color, opacity) {
  return `<div class="glow drift1" style="left:${x};top:${y};width:${w};height:${h};background:radial-gradient(circle, ${color}${opacity} 0%, transparent 70%);"></div>`;
}

// ── Секции ──
const sections = [];

// 1. HERO
sections.push({
  theme: "dark",
  html: `
    ${glow('-10%','-15%','50%','60%', GREEN_DARK, '55')}
    ${glow('70%','60%','45%','55%', AMBER, '18')}
    <div class="content-wrap" style="align-items:center;">
      <img src="${'{{LOGO}}'}" class="logo-float stagger" style="width:150px;height:auto;margin-bottom:22px;" />
      <h1 class="title" style="font-size:clamp(36px,5.5vw,64px);">MilkHunter&nbsp;Pro</h1>
      <p class="lede body-font" style="font-style:italic;font-size:19px;opacity:0.9;">Наука о рационе — как инструмент роста надоев и прибыли</p>
      <div class="stagger body-font" style="margin-top:28px;font-size:13px;color:#8FA396;text-align:center;">
        Платформа для составления, контроля и оптимизации рационов молочного стада<br>на основе NASEM 2021 / CNCPS v7
      </div>

  `
});

// 2. ПРОБЛЕМА
sections.push({
  theme: "light",
  html: `
    <div class="content-wrap">
      <div class="kicker">Индустрия молочного животноводства</div>
      <h1 class="title" style="color:#12160f;">Кормление — самая дорогая и самая рискованная переменная на ферме</h1>
      <div class="body-font" style="display:flex;gap:22px;margin-top:34px;flex-wrap:wrap;justify-content:center;">
        ${factCard('50–60%', 'себестоимости молока — это корма', '0ms')}
        ${factCard('NRC 2001', 'так и не обновлённая методика в большинстве программ', '120ms')}

function factCard(big, label, delay) {
  return `<div class="card stagger" style="transition-delay:${delay};background:#fff;border:1px solid #e2e5e8;width:280px;box-shadow:0 4px 16px rgba(0,0,0,0.06);">
    <div style="font-size:30px;font-weight:700;color:${GREEN};margin-bottom:10px;">${big}</div>
    <div style="font-size:13.5px;color:#4B5563;line-height:1.4;">${label}</div>
  </div>`;
}

sections.push({
  theme: "light",
  html: `

// ═══════════════════════════════════════════════════════════════
// Рендеринг и навигация
// ═══════════════════════════════════════════════════════════════
const deck = document.getElementById('deck');
const navdots = document.getElementById('navdots');
let current = 0;

sections.forEach((sec, i) => {
  const div = document.createElement('div');
  div.className = `section section-${sec.theme}`;
  div.innerHTML = sec.html.replaceAll('{{LOGO}}', LOGO_SRC);
  deck.appendChild(div);

  const dot = document.createElement('button');
  dot.className = 'navdot';
  dot.setAttribute('aria-label', `Раздел ${i+1}`);
  dot.addEventListener('click', () => goTo(i));
  navdots.appendChild(dot);
});

function render() {
  document.querySelectorAll('.section').forEach((el, i) => {
    el.classList.remove('active', 'leaving-up');
    if (i === current) el.classList.add('active');
  });
  document.querySelectorAll('.navdot').forEach((el, i) => el.classList.toggle('active', i === current));
  document.getElementById('progressBar').style.width = ((current+1)/sections.length*100) + '%';
  document.getElementById('btnUp').style.opacity = current === 0 ? '0.25' : '1';
  document.getElementById('btnDown').style.opacity = current === sections.length-1 ? '0.25' : '1';
}
function goTo(i) {
  if (i < 0 || i >= sections.length) return;
  current = i;
  render();
}

document.getElementById('btnDown').addEventListener('click', () => goTo(current+1));
document.getElementById('btnUp').addEventListener('click', () => goTo(current-1));

let wheelLock = false;
window.addEventListener('wheel', (e) => {
  if (wheelLock) return;
  wheelLock = true;
  setTimeout(() => wheelLock = false, 750);
  if (e.deltaY > 12) goTo(current+1);
  else if (e.deltaY < -12) goTo(current-1);
}, { passive: true });

window.addEventListener('keydown', (e) => {
  if (['ArrowDown','PageDown',' '].includes(e.key)) { e.preventDefault(); goTo(current+1); }
  if (['ArrowUp','PageUp'].includes(e.key)) { e.preventDefault(); goTo(current-1); }
});

let touchStartY = null;
window.addEventListener('touchstart', (e) => { touchStartY = e.touches[0].clientY; }, { passive: true });
window.addEventListener('touchend', (e) => {
  if (touchStartY === null) return;
  const dy = touchStartY - e.changedTouches[0].clientY;
  if (Math.abs(dy) > 50) { if (dy > 0) goTo(current+1); else goTo(current-1); }
  touchStartY = null;
}, { passive: true });

render();

const demoFeeds = [
  { name: 'Силос кукурузный', base: 8, energyPerKg: 2.3, costPerKg: 8.5 },
  { name: 'Комбикорм', kg: 6, energyPerKg: 3.1, costPerKg: 22 },
  { name: 'Сенаж люцерновый', kg: 5, energyPerKg: 2.0, costPerKg: 9 },
];
function updateDemo() {
  const slider = document.getElementById('demoSlider');
  const rowsEl = document.getElementById('demoRows');
  if (!slider || !rowsEl) return;
  const silageKg = parseFloat(slider.value);
  const totalEnergy = silageKg*demoFeeds[0].energyPerKg + demoFeeds[1].kg*demoFeeds[1].energyPerKg + demoFeeds[2].kg*demoFeeds[2].energyPerKg;
  const totalCost = silageKg*demoFeeds[0].costPerKg + demoFeeds[1].kg*demoFeeds[1].costPerKg + demoFeeds[2].kg*demoFeeds[2].costPerKg;
  const predictedMilk = Math.max(0, (totalEnergy - 95) / 5.2).toFixed(1);
  rowsEl.innerHTML = `
    ${demoRow('Силос кукурузный', silageKg.toFixed(1)+' кг')}
    ${demoRow('Энергия рациона (ОЭ)', Math.round(totalEnergy)+' МДж')}
    ${demoRow('Стоимость рациона', Math.round(totalCost)+' ₽/сутки')}
    ${demoRow('Прогноз надоя', predictedMilk+' кг/сутки', true)}
  `;
}
function demoRow(label, val, accent) {
  return `<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.08);">
    <span style="color:#AEBDB4;font-size:12.5px;">${label}</span>
    <span style="color:${accent ? AMBER : '#fff'};font-weight:700;font-size:${accent?'17px':'14px'};">${val}</span>
  </div>`;
}
document.addEventListener('input', (e) => { if (e.target.id === 'demoSlider') updateDemo(); });
setTimeout(updateDemo, 100);
